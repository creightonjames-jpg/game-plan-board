<title>Club Game Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">

<style>

:root{
  --paper:#F2F4F4; --surface:#FFFFFF; --surface-2:#E9EDEE; --surface-3:#DEE4E5;
  --line:#D5DCDD; --line-soft:#E4E9EA;
  --ink:#101A1C; --ink-2:#4A5A5C; --ink-3:#7C8B8D;
  --accent:#14606F; --accent-hover:#0E4A56; --accent-soft:#DEEDEF; --accent-line:#9CC4CB;
  --ok:#2F7A4F; --ok-soft:#DFF0E5;
  --warn:#9A7318; --warn-soft:#F6EBD2;
  --crit:#A93B2A; --crit-soft:#F7E2DE;
  --on-accent:#FFFFFF; --on-solid:#FFFFFF;
  --bar-bg:#101A1C; --bar-fg:#F2F4F4;
  --shadow:0 1px 2px rgba(16,26,28,.05), 0 8px 24px -12px rgba(16,26,28,.18);
  --shadow-lg:0 24px 60px -20px rgba(16,26,28,.35);
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1517; --surface:#151E20; --surface-2:#1D2729; --surface-3:#263234;
    --line:#2C3A3D; --line-soft:#232F31;
    --ink:#E7EDED; --ink-2:#9BAAAC; --ink-3:#6C7C7E;
    --accent:#4FB6C9; --accent-hover:#78CBDA; --accent-soft:#123239; --accent-line:#2A5A66;
    --ok:#63C08A; --ok-soft:#132B20;
    --warn:#D7A63F; --warn-soft:#2E2617;
    --crit:#E58771; --crit-soft:#33201B;
    --on-accent:#08191D; --on-solid:#0E1517;
    --bar-bg:#1D2729; --bar-fg:#E7EDED;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1517; --surface:#151E20; --surface-2:#1D2729; --surface-3:#263234;
  --line:#2C3A3D; --line-soft:#232F31;
  --ink:#E7EDED; --ink-2:#9BAAAC; --ink-3:#6C7C7E;
  --accent:#4FB6C9; --accent-hover:#78CBDA; --accent-soft:#123239; --accent-line:#2A5A66;
  --ok:#63C08A; --ok-soft:#132B20;
  --warn:#D7A63F; --warn-soft:#2E2617;
  --crit:#E58771; --crit-soft:#33201B;
  --on-accent:#08191D; --on-solid:#0E1517;
  --bar-bg:#1D2729; --bar-fg:#E7EDED;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance}
p{margin:0}
ul{margin:0; padding:0; list-style:none}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500}

.app{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh}
.rail{background:var(--surface); border-right:1px solid var(--line); display:flex;
  flex-direction:column; gap:2px; padding:20px 14px 24px; position:sticky; top:0;
  height:100vh; overflow-y:auto}
.brand{padding:0 8px 18px; border-bottom:1px solid var(--line-soft); margin-bottom:14px}
.brand h1{font-family:var(--display); font-size:21px; font-weight:600;
  letter-spacing:-.015em; line-height:1.1}
.brand .sub{margin-top:5px; font-size:11.5px; color:var(--ink-3)}
.railhead{display:flex; align-items:center; justify-content:space-between; padding:14px 8px 6px}
.navitem{display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 8px; border-radius:var(--r); color:var(--ink-2); font-size:13.5px}
.navitem:hover{background:var(--surface-2); color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.navitem .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--ink-3); opacity:.5}
.navitem[aria-current="true"] .dot{background:var(--accent); opacity:1}
.navitem .count{margin-left:auto; font-family:var(--mono); font-size:11px;
  color:var(--ink-3); font-variant-numeric:tabular-nums}
.navitem .count.flag{color:var(--crit); font-weight:600}
.navitem.mo{padding:5px 8px; font-size:12.5px}
.navitem.mo.past{color:var(--ink-3)}
.navitem.mo.now{background:var(--surface-2); font-weight:600; color:var(--ink)}
.railfoot{margin-top:auto; padding:16px 8px 0; border-top:1px solid var(--line-soft);
  display:flex; flex-direction:column; gap:8px}
.linkbtn{font-size:11.5px; color:var(--ink-3); text-align:left}
.linkbtn:hover{color:var(--accent); text-decoration:underline}

main{min-width:0; padding:0 0 80px}
.topbar{display:flex; align-items:center; gap:12px; padding:16px 32px;
  border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:20}
.search{flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:6px 10px}
.search input{border:none; background:none; outline:none; width:100%; font-size:13.5px}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none; color:var(--ink-3)}
.topbar .spacer{flex:1}
.wrap{padding:28px 32px; max-width:1180px}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  flex-wrap:wrap; margin-bottom:24px}
.pagehead h2{font-family:var(--display); font-size:28px; letter-spacing:-.02em; line-height:1.15}
.pagehead .meta{margin-top:6px; color:var(--ink-2); font-size:13px}

.btn{display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  font-size:13px; font-weight:500; color:var(--ink); white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:4px 9px; font-size:12px}

.provenance{
  display:flex; gap:12px; align-items:flex-start; background:var(--surface);
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:14px 16px; margin-bottom:24px;
}
.provenance .body{font-size:12.5px; color:var(--ink-2); line-height:1.55}
.provenance b{color:var(--ink); font-weight:600}
.provenance .eyebrow{display:block; margin-bottom:5px}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; margin-bottom:28px}
.stat{background:var(--surface); padding:14px 16px; border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--mono); font-size:26px; font-weight:500; letter-spacing:-.02em; line-height:1.1}
.stat .l{margin-top:4px; font-size:11.5px; color:var(--ink-2)}
.stat.warn .n{color:var(--warn)} .stat.crit .n{color:var(--crit)} .stat.ok .n{color:var(--ok)}

.section{margin-top:34px}
.sectionhead{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.sectionhead h3{font-size:14.5px; letter-spacing:-.005em}
.sectionhead .note{font-size:12px; color:var(--ink-3)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.panel .empty{padding:26px; text-align:center; color:var(--ink-3); font-size:13px}

.trackhead{
  display:flex; align-items:baseline; gap:10px; padding:11px 16px;
  background:var(--bar-bg); color:var(--bar-fg);
}
.trackhead h3{font-family:var(--display); font-size:15px; letter-spacing:-.01em}
.trackhead .note{font-size:11.5px; opacity:.7; font-family:var(--mono)}

.bucket{border-bottom:1px solid var(--line); background:var(--surface)}
.bucket:last-child{border-bottom:none}
.buckethead{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 16px; background:var(--surface-2); border-bottom:1px solid var(--line-soft)}
.buckethead:hover{background:var(--surface-3)}
.buckethead h4{font-size:12.5px; font-weight:600; letter-spacing:.01em}
.buckethead .chev{color:var(--ink-3); transition:transform .15s; flex:none}
.buckethead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.buckethead .tally{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.buckethead .when{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.progress{width:64px; height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; flex:none}
.progress i{display:block; height:100%; background:var(--ok)}

.row{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  padding:9px 16px 9px 0; border-bottom:1px solid var(--line-soft);
  position:relative; border-left:3px solid transparent}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row.sev-warn{border-left-color:var(--warn)}
.row.sev-crit{border-left-color:var(--crit)}
.row.is-done .title{color:var(--ink-3)}
.row.is-dropped .title{color:var(--ink-3); text-decoration:line-through}
.row .indent{flex:none}
.marker{flex:none; width:17px; height:17px; margin-top:1px; border-radius:4px;
  border:1.5px solid var(--ink-3); display:grid; place-items:center;
  color:var(--surface); background:var(--surface)}
.marker.unrec{border-style:dashed; border-color:var(--ink-3)}
.marker:hover{border-color:var(--accent)}
.marker.done{background:var(--ok); border-color:var(--ok); color:var(--on-solid); border-style:solid}
.marker.decision{border-radius:0; transform:rotate(45deg); width:14px; height:14px; margin-top:2px}
.marker.decision.done{background:var(--accent); border-color:var(--accent)}
.marker.question{border-radius:50%; border-color:var(--warn); color:var(--warn);
  font-size:11px; font-weight:700; font-family:var(--mono)}
.marker.question.done{background:var(--warn); color:var(--on-solid)}
.rowbody{flex:1; min-width:0}
.row .title{font-size:13.5px; line-height:1.45}
.rowmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11px;
  color:var(--ink-2); font-family:var(--mono)}
.chip.due.over{color:var(--crit); font-weight:600}
.chip.stall{color:var(--warn); font-weight:600}
.chip.notes{color:var(--ink-3)}
.chip.flagged{color:var(--warn); font-weight:600}
.chip.conflict{color:var(--crit); font-weight:600}
.pill{flex:none; font-size:10.5px; font-family:var(--mono); letter-spacing:.03em;
  text-transform:uppercase; padding:2px 7px; border-radius:20px; white-space:nowrap;
  border:1px solid transparent; margin-top:2px}
.pill.unrecorded{background:transparent; color:var(--ink-3); border:1px dashed var(--line)}
.pill.not_started{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.pill.in_progress{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.pill.done{background:var(--ok-soft); color:var(--ok)}
.pill.parked{background:var(--warn-soft); color:var(--warn)}
.pill.dropped{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.lastnote{margin-top:5px; font-size:12.5px; color:var(--ink-2); line-height:1.45;
  border-left:2px solid var(--line); padding-left:9px}
.lastnote b{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--ink-3)}
.srcnote{margin-top:5px; font-size:12px; color:var(--warn); line-height:1.45;
  border-left:2px solid var(--warn); padding-left:9px}

.filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.fchip{padding:4px 11px; border-radius:20px; border:1px solid var(--line);
  background:var(--surface); font-size:12px; color:var(--ink-2)}
.fchip:hover{border-color:var(--ink-3)}
.fchip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.fchip .n{font-family:var(--mono); font-size:11px; opacity:.65; margin-left:4px}

.att{width:100%; border-collapse:collapse}
.att th{text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:9px 14px;
  border-bottom:1px solid var(--line); background:var(--surface-2)}
.att td{padding:10px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-size:13px}
.att tr:last-child td{border-bottom:none}
.att tbody tr{cursor:pointer}
.att tbody tr:hover{background:var(--surface-2)}
.att .club{font-size:12px; color:var(--ink-2); white-space:nowrap}
.att .num{font-family:var(--mono); font-size:12px; white-space:nowrap}
.att .num.crit{color:var(--crit); font-weight:600}
.att .num.warn{color:var(--warn); font-weight:600}
.tablewrap{overflow-x:auto}

/* calendar */
.calgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
.mcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column; overflow:hidden; text-align:left}
.mcard.past{opacity:.72}
.mcard.now{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.mcardhead{display:flex; align-items:baseline; gap:8px; padding:11px 14px;
  border-bottom:1px solid var(--line-soft); background:var(--surface-2)}
.mcardhead h4{font-family:var(--display); font-size:16px; letter-spacing:-.01em}
.mcardhead .tag{margin-left:auto; font-family:var(--mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.mcard.now .mcardhead .tag{color:var(--accent); font-weight:600}
.mitems{padding:4px 0}
.mitem{display:flex; gap:8px; align-items:flex-start; padding:6px 14px; width:100%; text-align:left}
.mitem:hover{background:var(--surface-2)}
.mitem .d{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); flex:none;
  width:34px; padding-top:2px; font-variant-numeric:tabular-nums}
.mitem .d.over{color:var(--crit); font-weight:600}
.mitem .t{font-size:12.5px; line-height:1.4; flex:1; min-width:0}
.mitem .qm{color:var(--warn); font-weight:700; font-family:var(--mono); font-size:11px; flex:none}
.mitem .fl{color:var(--warn); flex:none; font-size:11px}

.scrim{position:fixed; inset:0; background:rgba(16,26,28,.4); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; height:100vh; width:min(480px,100vw);
  background:var(--surface); border-left:1px solid var(--line); z-index:50;
  transform:translateX(102%); transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg)}
.drawer.open{transform:none}
.drawerhead{padding:18px 20px 14px; border-bottom:1px solid var(--line)}
.drawerhead .top{display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px; margin-bottom:10px}
.drawerhead h3{font-size:16px; line-height:1.35; letter-spacing:-.005em}
.drawerbody{flex:1; overflow-y:auto; padding:18px 20px 28px}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3)}
.field select,.field input{border:1px solid var(--line); background:var(--surface);
  border-radius:6px; padding:6px 8px; font-size:13px; outline:none; width:100%}
.field select:focus,.field input:focus,textarea:focus{border-color:var(--accent)}
textarea{border:1px solid var(--line); background:var(--surface); border-radius:6px;
  padding:9px 10px; font-size:13.5px; outline:none; width:100%; resize:vertical;
  font-family:var(--sans); line-height:1.5}
.composer{display:flex; flex-direction:column; gap:8px; margin-bottom:24px}
.composer .actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.sourcebox{background:var(--surface-2); border-radius:6px; padding:10px 12px;
  font-size:12.5px; color:var(--ink-2); line-height:1.5; margin-bottom:20px}
.sourcebox .eyebrow{display:block; margin-bottom:5px}
.sourcebox code{font-family:var(--mono); font-size:11.5px; color:var(--ink)}

.timeline{position:relative; padding-left:20px}
.timeline::before{content:""; position:absolute; left:4.5px; top:5px; bottom:5px;
  width:1px; background:var(--line)}
.tl{position:relative; padding-bottom:18px}
.tl::before{content:""; position:absolute; left:-20px; top:5px; width:9px; height:9px;
  border-radius:50%; background:var(--surface); border:2px solid var(--line-soft);
  box-shadow:0 0 0 3px var(--surface)}
.tl.mark::before{background:var(--accent); border-color:var(--accent)}
.tl .when{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.tl .who{font-size:11.5px; color:var(--ink-2); font-weight:600}
.tl .what{font-size:13.5px; margin-top:3px; line-height:1.5}
.tl .what.sys{color:var(--ink-2); font-style:italic}

.meetbar{background:var(--bar-bg); color:var(--bar-fg); padding:12px 32px;
  display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:25;
  box-shadow:inset 0 -2px 0 var(--accent)}
.meetbar .live{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.meetbar .live i{width:7px; height:7px; border-radius:50%; background:var(--crit); display:block}
@media (prefers-reduced-motion:no-preference){.meetbar .live i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.meetbar .who{font-family:var(--display); font-size:16px; font-weight:600}
.meetbar .tally{margin-left:auto; font-family:var(--mono); font-size:12px; opacity:.7}
.meetbar .btn{background:transparent; border-color:color-mix(in srgb, var(--bar-fg) 32%, transparent); color:var(--bar-fg)}
.meetbar .btn:hover{background:color-mix(in srgb, var(--bar-fg) 12%, transparent); border-color:var(--bar-fg)}
.meetbar .btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.meetbar .btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}

.mrow{display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line-soft);
  border-left:3px solid transparent; align-items:flex-start}
.mrow:last-child{border-bottom:none}
.mrow.sev-warn{border-left-color:var(--warn)} .mrow.sev-crit{border-left-color:var(--crit)}
.mrow.touched{background:var(--accent-soft)}
.mrow .mbody{flex:1; min-width:0}
.mrow .mtitle{font-size:14px; line-height:1.4}
.statusgroup{display:flex; gap:0; border:1px solid var(--line); border-radius:6px;
  overflow:hidden; flex:none}
.statusgroup button{padding:4px 8px; font-size:11px; font-family:var(--mono);
  color:var(--ink-2); border-right:1px solid var(--line); background:var(--surface)}
.statusgroup button:last-child{border-right:none}
.statusgroup button:hover{background:var(--surface-2)}
.statusgroup button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.notefield{margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.notefield input{flex:1; min-width:180px; border:1px solid var(--line);
  background:var(--surface); border-radius:6px; padding:6px 9px; font-size:13px; outline:none}
.notefield input:focus{border-color:var(--accent)}
.whosel{border:1px solid var(--line); background:var(--surface); border-radius:6px;

function buildSeed(){
  const keyed = {}, items = [];
  SEED_BAL.forEach((s,i) => {
    const id = "bal-" + String(i).padStart(3,"0");
    if (s.k) keyed["bal:" + s.k] = id;
    items.push({
      id, club:"bal", bucket:s.b, track: isMonth(s.b) ? "calendar" : "program",
      _pkey: s.p ? "bal:" + s.p : null, parent:null,
      title:s.t, type:s.ty || "task", owner:s.o || "Unassigned",
      status:"unrecorded", created:PLAN_CREATED, due:s.d || null, completed:null,
      flagged:!!s.f, conflict:s.x || null, imported:true, updates:[]
    });
  });
  SEED_DEMO.forEach((s,i) => {
    const id = s.c + "-" + String(i).padStart(3,"0");
    if (s.k) keyed[s.c + ":" + s.k] = id;
    items.push({
      id, club:s.c, bucket:s.b, track:"program",
      _pkey: s.p ? s.c + ":" + s.p : null, parent:null,
      title:s.t, type:s.ty || "task", owner:s.o, status:s.s,
      created:ago(s.cr), due: s.du === undefined ? null : (s.du >= 0 ? ahead(s.du) : ago(-s.du)),
      completed: s.dn === undefined ? null : ago(s.dn),
      flagged:false, conflict:null, imported:false,
      updates:(s.u || []).map(u => ({date:ago(u[0]), who:u[1], text:u[2]}))
    });
  });
  items.forEach(it => { if (it._pkey) it.parent = keyed[it._pkey] || null; delete it._pkey; });
  const meetings = DEMO_MEETINGS.map((m,i) => ({id:"m"+i, club:m.c, date:ago(m.d), kind:m.kind, changes:[], closed:true}));
  return {items, meetings, v:3};
}

  db = raw ? JSON.parse(raw) : buildSeed();
  if (!db || !db.items || db.v !== 3) db = buildSeed();
} catch(e){ db = buildSeed(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }

const state = {view:"portfolio", club:null, filter:"all", month:null, q:"",
               drawer:null, meeting:null, collapsed:{}};

const club = id => CLUBS.find(c => c.id === id);
const item = id => db.items.find(i => i.id === id);
const clubItems = id => db.items.filter(i => i.club === id);
const monthItems = (cid,m) => db.items.filter(i => i.club === cid && i.bucket === m);
const lastTouch = it => {
  const u = it.updates.length ? it.updates[it.updates.length-1].date : it.created;
  return it.completed && it.completed > u ? it.completed : u;
};
const ageDays = it => daysSince(lastTouch(it));
const isStalled = it => TRACKED(it.status) && ageDays(it) >= STALL_DAYS;
const isOverdue = it => OPEN(it.status) && it.due && daysSince(it.due) > 0;
const severity = it => isOverdue(it) ? "crit" : isStalled(it) ? "warn" : null;
const carryOver = it => db.meetings.filter(m => m.club === it.club && m.closed && m.date > it.created).length;
const meetingsFor = id => db.meetings.filter(m => m.club === id && m.closed).sort((a,b) => b.date.localeCompare(a.date));
const monthIndex = () => TODAY.getMonth();

function clubStats(id){
  const l = clubItems(id);
  return {
    total:l.length,
    open:l.filter(i => OPEN(i.status)).length,
    unrecorded:l.filter(i => i.status === "unrecorded").length,
    stalled:l.filter(isStalled).length,
    overdue:l.filter(isOverdue).length,
    closed30:l.filter(i => i.completed && daysSince(i.completed) <= 30).length,
    questions:l.filter(i => i.type === "question" && OPEN(i.status)).length,
    done:l.filter(i => i.status === "done").length
  };
}
function momentum(id){
  const l = clubItems(id).filter(i => i.completed);
  return [4,3,2,1,0].map(b => l.filter(i => {
    const d = daysSince(i.completed);
    return d >= b*30 && d < (b+1)*30;
  }).length);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short", day:"numeric"});
const fmtDay = d => new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"numeric", day:"numeric"});
const fmtLong = d => new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"});
function relDue(d){
  const n = daysSince(d);
  if (n === 0) return "due today";
  return n > 0 ? n + "d overdue" : "due " + fmt(d);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
const teamOf = cid => (club(cid).team || []).concat(["You (Regional)"])
  .filter((v,i,a) => a.indexOf(v) === i);

const view = document.getElementById("view");

function renderRail(){
  document.querySelector('[data-nav="portfolio"]')
    .setAttribute("aria-current", state.view === "portfolio" ? "true" : "false");
  document.getElementById("clublist").innerHTML = CLUBS.map(c => {
    const s = clubStats(c.id);
    const flag = s.overdue + s.stalled;
    const on = state.club === c.id && state.view !== "portfolio";
    return `<button class="navitem" data-club="${c.id}" aria-current="${on}">
      <span class="dot"></span>${esc(c.short)}
      ${c.real ? `<span class="tag live">real</span>` : ""}
      <span class="count ${flag ? "flag":""}">${flag ? flag + "!" : s.open}</span>
    </button>`;
  }).join("");

  const c = state.club ? club(state.club) : null;
  document.getElementById("monthnav").innerHTML = (c && c.calendar && state.view !== "portfolio")
    ? `<div class="railhead"><span class="eyebrow">${esc(c.short)} &middot; months</span></div>` +
      MONTHS.map((m,idx) => {
        const l = monthItems(c.id,m), over = l.filter(isOverdue).length;
        const cls = idx < monthIndex() ? "past" : idx === monthIndex() ? "now" : "";
        return `<button class="navitem mo ${cls}" data-month="${m}">
          <span class="dot"></span>${m}
          <span class="count ${over?"flag":""}">${over ? over+"!" : l.length}</span></button>`;
      }).join("")
    : "";
}

function provenance(){
  const conflicts = clubItems("bal").filter(i => i.conflict).length;
  const n = clubItems("bal").length;
  return `<div class="provenance"><div class="body">
    <span class="eyebrow">Imported, not invented</span>
    All ${n} Balcones items come from <b>2026 Game Plan.docx</b> (Lisa Henrichsen, revision 55,
    last edited by Lindsey Jenkins on 12 Feb 2026). The document records <b>no status of any kind</b>,
    so everything imported as <b>Not recorded</b> — that is the true state of the plan, not a
    placeholder. Dates appear only where the document states one. Yellow highlighting is kept as
    <b>flagged</b>, and the ${conflicts} places where the document contradicts itself are marked as
    <b>source conflicts</b>.
  </div></div>`;
}

/* ---------------- portfolio ---------------- */
function renderPortfolio(){
  const all = db.items;
  const open = all.filter(i => OPEN(i.status));
  const unrec = all.filter(i => i.status === "unrecorded");
  const overdue = all.filter(isOverdue);
  const stalled = all.filter(isStalled);
  const questions = all.filter(i => i.type === "question" && OPEN(i.status));
  const closed30 = all.filter(i => i.completed && daysSince(i.completed) <= 30);

  const attention = overdue.concat(stalled.filter(i => !isOverdue(i)))
    .sort((a,b) => {
      const ao = isOverdue(a) ? daysSince(a.due) : -1, bo = isOverdue(b) ? daysSince(b.due) : -1;
      return bo - ao || ageDays(b) - ageDays(a);
    }).slice(0,14);

  view.innerHTML = `<div class="wrap">
    <div class="pagehead">
      <div>
        <span class="eyebrow">Portfolio</span>
        <h2>Seven clubs, one game plan each</h2>
        <p class="meta">${all.length} tracked items &middot; Balcones is a real imported plan, the other six are invented demo data</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">${open.length}</div><div class="l">Open commitments</div></div>
      <div class="stat crit"><div class="n">${overdue.length}</div><div class="l">Past their due date</div></div>
      <div class="stat crit"><div class="n">${unrec.length}</div><div class="l">No status recorded</div></div>
      <div class="stat warn"><div class="n">${stalled.length}</div><div class="l">Silent 30+ days</div></div>
      <div class="stat warn"><div class="n">${questions.length}</div><div class="l">Open questions</div></div>
      <div class="stat ok"><div class="n">${closed30.length}</div><div class="l">Closed in 30 days</div></div>
    </div>

    <div class="clubgrid">${CLUBS.map(c => {
      const s = clubStats(c.id), m = momentum(c.id), peak = Math.max(1, ...m);
      return `<button class="clubcard ${c.real?"real":""}" data-open="${c.id}">
        <div>
          <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start">
            <div>
              <div class="name">${esc(c.short)}</div>
              <div class="where">${esc(c.loc)}</div>
            </div>
            <span class="tag ${c.real?"live":"demo"}">${c.real?"real plan":"demo"}</span>
          </div>
          <div class="gm" style="margin-top:8px">${esc(c.gm)}${c.plan ? " &middot; " + esc(c.plan) : ""}</div>
        </div>
        <div class="cardstats">
          <div><span class="v">${s.open}</span><span class="k">open</span></div>
          <div><span class="v ${s.overdue?"crit":""}">${s.overdue}</span><span class="k">overdue</span></div>
          <div><span class="v ${s.unrecorded?"crit":s.stalled?"warn":""}">${s.unrecorded || s.stalled}</span><span class="k">${s.unrecorded?"unrecorded":"stalled"}</span></div>
          <div><span class="v ok">${s.closed30}</span><span class="k">closed 30d</span></div>
          <div class="spark" title="Items closed per month over the last five months: ${m.join(", ")}">${
            m.map(n => `<i><b style="height:${n ? Math.max(4, Math.round(n/peak*26)) : 2}px"></b></i>`).join("")}</div>
        </div>
        <div class="meetline">
          <span>${c.real ? "source last edited " + daysSince("2026-02-12") + "d ago" : "last met " + c.last + "d ago"}</span>
          <span>${c.real ? clubItems(c.id).length + " items" : "next in " + c.next + "d"}</span>
        </div>
      </button>`;
    }).join("")}</div>

    <div class="section">
      <div class="sectionhead"><h3>Needs attention</h3>
        <span class="note">Overdue first, then anything tracked and untouched for ${STALL_DAYS}+ days</span></div>
      <div class="panel tablewrap">
        <table class="att">
          <thead><tr><th>Item</th><th>Club</th><th>Owner</th><th>Why</th></tr></thead>
          <tbody>${attention.map(i => `<tr data-item="${i.id}">
            <td>${esc(i.title)}</td>
            <td class="club">${esc(club(i.club).short)}</td>
            <td class="club">${esc(String(i.owner).replace(/ \(.*\)/,""))}</td>
            <td class="num ${isOverdue(i)?"crit":"warn"}">${isOverdue(i) ? daysSince(i.due)+"d overdue" : "silent "+ageDays(i)+"d"}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

/* ---------------- item row ---------------- */
function itemRow(it, depth){
  const sev = severity(it);
  const kids = db.items.filter(k => k.parent === it.id);
  const note = it.updates.length ? it.updates[it.updates.length-1] : null;
  const co = carryOver(it);
  const unrec = it.status === "unrecorded" ? "unrec" : "";
  const mark = it.type === "decision"
    ? `<span class="marker decision ${it.status==="done"?"done":""} ${unrec}"></span>`
    : it.type === "question"
      ? `<span class="marker question ${it.status==="done"?"done":""}">?</span>`
      : `<span class="marker ${it.status==="done"?"done":""} ${unrec}">${it.status==="done"
        ? '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 4.8 8.5 9.5 3.6"/></svg>' : ""}</span>`;
  return `<div class="row ${sev?"sev-"+sev:""} is-${it.status}" data-item="${it.id}" tabindex="0" role="button">
      <span class="indent" style="width:${16 + depth*22}px"></span>
      ${mark}
      <div class="rowbody">
        <div class="title">${esc(it.title)}</div>
        <div class="rowmeta">
          ${it.owner && it.owner !== "Unassigned" ? `<span class="chip owner">${esc(it.owner)}</span>` : `<span class="chip notes">unassigned</span>`}
          ${it.due && OPEN(it.status) ? `<span class="chip due ${isOverdue(it)?"over":""}">${relDue(it.due)}</span>` : ""}
          ${it.flagged ? `<span class="chip flagged">flagged in source</span>` : ""}
          ${it.conflict ? `<span class="chip conflict">source conflict</span>` : ""}
          ${isStalled(it) ? `<span class="chip stall">silent ${ageDays(it)}d</span>` : ""}
          ${!it.imported && OPEN(it.status) && co >= 2 ? `<span class="chip notes">carried ${co} meetings</span>` : ""}
          ${it.updates.length ? `<span class="chip notes">${it.updates.length} note${it.updates.length>1?"s":""}</span>` : ""}
        </div>
        ${it.conflict ? `<div class="srcnote">${esc(it.conflict)}</div>` : ""}
        ${note ? `<div class="lastnote"><b>${fmt(note.date)} &middot; ${esc(note.who)}</b><br>${esc(note.text)}</div>` : ""}
      </div>
      <span class="pill ${it.status}">${STATUSES[it.status]}</span>
    </div>` + kids.map(k => itemRow(k, depth+1)).join("");
}

function filterItems(list){
  const f = state.filter;
  if (f === "unrecorded") return list.filter(i => i.status === "unrecorded");
  if (f === "overdue") return list.filter(isOverdue);
  if (f === "attention") return list.filter(i => isStalled(i) || isOverdue(i));
  if (f === "questions") return list.filter(i => i.type === "question");
  if (f === "decisions") return list.filter(i => i.type === "decision");
  if (f === "flagged") return list.filter(i => i.flagged || i.conflict);
  if (f === "open") return list.filter(i => OPEN(i.status));
  if (f === "mine") return list.filter(i => String(i.owner).startsWith("You"));
  return list;
}

function filterBar(list, keys){
  const c = {
    all:list.length,
    open:list.filter(i => OPEN(i.status)).length,
    unrecorded:list.filter(i => i.status === "unrecorded").length,
    overdue:list.filter(isOverdue).length,
    attention:list.filter(i => isStalled(i) || isOverdue(i)).length,
    questions:list.filter(i => i.type === "question").length,
    decisions:list.filter(i => i.type === "decision").length,
    flagged:list.filter(i => i.flagged || i.conflict).length,
    mine:list.filter(i => String(i.owner).startsWith("You")).length
  };
  const L = {all:"Everything", open:"Open", unrecorded:"Not recorded", overdue:"Overdue",
             attention:"Needs attention", questions:"Questions", decisions:"Decisions",
             flagged:"Flagged", mine:"Mine"};
  return `<div class="filters">${keys.map(k =>
    `<button class="fchip" data-filter="${k}" aria-pressed="${state.filter===k}">${L[k]}<span class="n">${c[k]}</span></button>`).join("")}</div>`;
}

function bucketBlock(b, shown, all, subtitle){
  const roots = shown.filter(i => i.bucket === b && !i.parent);
  const orphans = shown.filter(i => i.bucket === b && i.parent && !shown.some(s => s.id === i.parent));
  const tops = roots.concat(orphans);
  if (!tops.length) return "";
  const bAll = all.filter(i => i.bucket === b);
  const bDone = bAll.filter(i => i.status === "done" || i.status === "dropped").length;
  const pct = bAll.length ? Math.round(bDone/bAll.length*100) : 0;
  const collapsed = state.collapsed[state.club + b];
  return `<div class="bucket">
    <button class="buckethead" data-bucket="${esc(b)}" aria-expanded="${!collapsed}">
      <svg class="chev" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      <h4>${esc(b)}</h4>
      ${subtitle ? `<span class="when">${subtitle}</span>` : ""}
      <span class="tally">${bDone}/${bAll.length}</span>
      <span class="progress"><i style="width:${pct}%"></i></span>
    </button>
    ${collapsed ? "" : tops.map(i => itemRow(i,0)).join("")}
  </div>`;
}

/* ---------------- club board ---------------- */
function renderClub(){
  const c = club(state.club), s = clubStats(c.id), all = clubItems(c.id);
  const keep = new Set(filterItems(all).map(i => i.id));
  all.forEach(i => { if (keep.has(i.id)) { let p = i.parent; while (p){ keep.add(p); p = (item(p)||{}).parent; } } });
  const shown = all.filter(i => keep.has(i.id));
  const prog = shown.filter(i => i.track === "program");
  const cal = shown.filter(i => i.track === "calendar");
  const past = meetingsFor(c.id);
  const keys = c.real ? ["all","unrecorded","overdue","questions","decisions","flagged"]
                      : ["open","attention","questions","decisions","mine","all"];

  view.innerHTML = `<div class="wrap">
    <div class="pagehead">
      <div>
        <span class="eyebrow">${esc(c.kind)} &middot; ${esc(c.loc)} &middot; ${esc(c.gm)}${c.real ? " &middot; real imported plan" : " &middot; demo data"}</span>
        <h2>${esc(c.name)}</h2>
        <p class="meta">${c.real
          ? `${all.length} items &middot; ${s.unrecorded} with no recorded status &middot; ${s.overdue} past a date the plan set &middot; source last edited ${daysSince("2026-02-12")} days ago`
          : `${s.open} open &middot; ${s.overdue} overdue &middot; ${s.stalled} stalled &middot; last met ${past.length?fmt(past[0].date):"—"} &middot; next in ${c.next} days`}</p>
      </div>
      <div style="display:flex; gap:8px">
        <button class="btn" id="addbtn">Add item</button>
        <button class="btn primary" id="startmeet">Start a review</button>
      </div>
    </div>

    ${c.real ? provenance() : ""}
    ${filterBar(all, keys)}

    <div class="panel">
      ${prog.length ? `<div class="trackhead"><h3>${c.real ? "Standing programs" : "Game plan"}</h3>
        <span class="note">${all.filter(i=>i.track==="program").length} items</span></div>` : ""}
      ${c.buckets.map(b => bucketBlock(b, prog, all, "")).join("")}
      ${c.calendar && cal.length ? `<div class="trackhead"><h3>2026 calendar</h3>
        <span class="note">${all.filter(i=>i.track==="calendar").length} month-anchored items</span></div>
        ${MONTHS.map(m => bucketBlock(m, cal, all, m === MONTHS[monthIndex()] ? "this month" : "")).join("")}` : ""}
      ${!prog.length && !cal.length ? `<div class="empty">Nothing matches this filter.</div>` : ""}
    </div>

    ${c.real ? `<div class="section">
      <div class="sectionhead"><h3>The document's own history</h3>
        <span class="note">Every dated trace the Word file carries</span></div>
      <div class="panel">${DOC_HISTORY.map(h => `<div class="sresult" style="cursor:default">
        <div class="t">${esc(h.text)}</div>
        <div class="c">${fmtLong(h.date)} &middot; ${esc(h.who)}</div></div>`).join("")}</div>
    </div>` : `<div class="section">
      <div class="sectionhead"><h3>Meeting history</h3>
        <span class="note">Every checkpoint over the same living plan</span></div>
      <div class="panel">${past.map(m => `<div class="sresult" style="cursor:default">
        <div class="t">${esc(m.kind)} &mdash; ${fmtLong(m.date)}</div>
        <div class="c">${daysSince(m.date)} days ago</div></div>`).join("") || `<div class="empty">No meetings logged.</div>`}</div>
    </div>`}
  </div>`;
}

/* ---------------- calendar (Balcones) ---------------- */
function renderCalendar(){
  const c = club(state.club), now = monthIndex(), focus = state.month;
  if (focus){
    const list = filterItems(monthItems(c.id,focus));
    const idx = MONTHS.indexOf(focus);
    view.innerHTML = `<div class="wrap">
      <div class="pagehead">
        <div>
          <span class="eyebrow">${esc(c.short)} &middot; ${idx<now?"already past":idx===now?"current month":"ahead"}</span>
          <h2>${esc(focus)}</h2>
          <p class="meta">${monthItems(c.id,focus).length} items from the document &middot; ${monthItems(c.id,focus).filter(isOverdue).length} past their date</p>
        </div>
        <button class="btn" data-club="${c.id}">Back to the plan</button>
      </div>
      ${filterBar(monthItems(c.id,focus), ["all","unrecorded","overdue","questions","flagged"])}
      <div class="panel">${list.length ? list.map(i => itemRow(i,0)).join("") : `<div class="empty">Nothing matches this filter.</div>`}</div>
    </div>`;
    return;
  }
  view.innerHTML = `<div class="wrap">
    <div class="pagehead"><div>
      <span class="eyebrow">${esc(c.short)} &middot; month by month</span>
      <h2>2026 calendar</h2>
      <p class="meta">${clubItems(c.id).filter(i=>i.track==="calendar").length} month-anchored items. ${clubItems(c.id).filter(isOverdue).length} are past a date the plan set.</p>
    </div></div>
    <div class="calgrid">${MONTHS.map((m,idx) => {
      const list = monthItems(c.id,m).slice().sort((a,b) => (a.due||"9").localeCompare(b.due||"9"));
      const cls = idx < now ? "past" : idx === now ? "now" : "";
      const over = list.filter(isOverdue).length;
      return `<div class="mcard ${cls}">
        <button class="mcardhead" data-month="${m}">
          <h4>${m}</h4>
          <span class="tag">${idx===now?"this month":over?over+" overdue":list.length+" items"}</span>
        </button>
        <div class="mitems">${list.map(i => `<button class="mitem" data-item="${i.id}">
          <span class="d ${isOverdue(i)?"over":""}">${i.due ? fmtDay(i.due) : "—"}</span>
          <span class="t">${esc(i.title)}</span>
          ${i.type==="question"?`<span class="qm">?</span>`:""}
          ${i.flagged?`<span class="fl">&#9733;</span>`:""}
        </button>`).join("")}</div>
      </div>`;
    }).join("")}</div>
  </div>`;
}

/* ---------------- meeting ---------------- */
function renderMeeting(){
  const m = state.meeting, c = club(m.club), now = monthIndex();
  const all = clubItems(m.club);
  const scope = c.calendar
    ? all.filter(i => OPEN(i.status) && (isOverdue(i) || i.bucket === MONTHS[now] ||
        i.bucket === MONTHS[now+1] || i.flagged || i.conflict))
    : all.filter(i => OPEN(i.status));
  const live = scope.sort((a,b) => {
    const rank = i => isOverdue(i) ? 0 : i.conflict ? 1 : isStalled(i) ? 2 : i.flagged ? 3 : 4;
    return rank(a) - rank(b) || (a.due||"9").localeCompare(b.due||"9");
  });
  const touched = new Set(m.changes.map(ch => ch.item));
  const team = teamOf(m.club);

  view.innerHTML = `
  <div class="meetbar">
    <span class="live"><i></i>Review in progress</span>
    <span class="who">${esc(c.short)}</span>
    <span class="tally">${m.changes.length} change${m.changes.length===1?"":"s"} recorded</span>
    <button class="btn" id="meetadd">Add item</button>
    <button class="btn primary" id="meetend">End and write the recap</button>
  </div>
  <div class="wrap">
    <div class="pagehead"><div>
      <span class="eyebrow">${fmtLong(m.date)}</span>
      <h2>Working the plan</h2>
      <p class="meta">${c.calendar
        ? `Scoped to what needs a decision today: everything overdue, everything in ${MONTHS[now]}${MONTHS[now+1]?" and "+MONTHS[now+1]:""}, plus anything flagged or contradictory.`
        : "Open items, ordered by what is hurting."} ${live.length} items.</p>
    </div></div>
    <div class="panel">${live.map(i => {
      const sev = severity(i);
      return `<div class="mrow ${sev?"sev-"+sev:""} ${touched.has(i.id)?"touched":""}">
        <div class="mbody">
          <div class="mtitle">${esc(i.title)}</div>
          <div class="rowmeta">
            <span class="chip notes">${esc(i.bucket)}</span>
            ${i.owner && i.owner !== "Unassigned" ? `<span class="chip owner">${esc(i.owner)}</span>` : `<span class="chip notes">unassigned</span>`}
            ${i.due ? `<span class="chip due ${isOverdue(i)?"over":""}">${relDue(i.due)}</span>` : ""}
            ${i.flagged ? `<span class="chip flagged">flagged in source</span>` : ""}
            ${i.conflict ? `<span class="chip conflict">source conflict</span>` : ""}
            ${isStalled(i) ? `<span class="chip stall">silent ${ageDays(i)}d</span>` : ""}
          </div>
          ${i.conflict ? `<div class="srcnote">${esc(i.conflict)}</div>` : ""}
          <div class="notefield">
            <input type="text" placeholder="What did you land on?" data-note="${i.id}">
            <select class="whosel" data-who="${i.id}" aria-label="Who said it">${
              team.map(p => `<option ${p === (i.owner && i.owner !== "Unassigned" ? i.owner : "You (Regional)") ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
            <button class="btn sm" data-savenote="${i.id}">Log</button>
            <button class="btn sm ghost" data-open-item="${i.id}">History</button>
          </div>
        </div>
        <div class="statusgroup">
          ${["not_started","in_progress","done","dropped"].map(s =>
            `<button data-set="${i.id}|${s}" aria-pressed="${i.status===s}">${
              {not_started:"open",in_progress:"working",done:"done",dropped:"drop"}[s]}</button>`).join("")}
        </div>
      </div>`;
    }).join("") || `<div class="empty">Nothing needs attention in this window.</div>`}</div>
  </div>`;
}

function buildRecap(m){
  const ch = m.changes, seen = id => item(id);
  const decisions = ch.filter(x => x.note && (seen(x.item)||{}).type === "decision");
  const closed = ch.filter(x => x.to === "done");
  const dropped = ch.filter(x => x.to === "dropped");
  const notes = ch.filter(x => x.note && decisions.indexOf(x) === -1);
  const created = (m.created||[]).map(seen).filter(Boolean);
  const all = clubItems(m.club);
  const stillUnrec = all.filter(i => i.status === "unrecorded" && isOverdue(i));
  const stillStalled = all.filter(i => isStalled(i) && !ch.some(x => x.item === i.id));
  const openQs = all.filter(i => i.type === "question" && OPEN(i.status));
  const upcoming = all.filter(i => OPEN(i.status) && i.due && daysSince(i.due) <= 0)
    .sort((a,b) => a.due.localeCompare(b.due)).slice(0,12);
  return {decisions, closed, dropped, notes, created, stillUnrec, stillStalled, openQs, upcoming};
}

function renderRecap(){
  const m = state.meeting, c = club(m.club), r = buildRecap(m);
  const li = (t,sub,own) => `<li>${esc(t)}${sub?`<span class="sub">${esc(sub)}</span>`:""}${own?`<span class="sub own">${esc(own)}</span>`:""}</li>`;
  const sec = (title,rows,empty) => `<section><h3>${title}</h3>${
    rows.length ? `<ul>${rows.join("")}</ul>` : `<p class="none">${empty}</p>`}</section>`;
  view.innerHTML = `<div class="wrap">
    <div class="pagehead">
      <div><span class="eyebrow">Generated from the review</span><h2>Recap</h2>
      <p class="meta">Every line came from a status change or a note logged during the review. Nothing retyped.</p></div>
      <div style="display:flex; gap:8px">
        <button class="btn" id="copyrecap">Copy as text</button>
        <button class="btn" onclick="window.print()">Print</button>
        <button class="btn primary" data-club="${c.id}">Back to the plan</button>
      </div>
    </div>
    <div class="recap" id="recapdoc">
      <h2>${esc(c.name)}</h2>
      <div class="rmeta">${c.plan ? esc(c.plan) + " &middot; " : ""}plan review &middot; ${fmtLong(m.date)}</div>
      ${sec("Decisions made", r.decisions.map(x => li(item(x.item).title, x.note)), "No decisions were recorded.")}
      ${sec("Closed out", r.closed.map(x => li(item(x.item).title, x.note||"", item(x.item).owner)), "Nothing was closed.")}
      ${sec("Dropped", r.dropped.map(x => li(item(x.item).title, x.note||"")), "Nothing was dropped.")}
      ${sec("New commitments", r.created.map(i => li(i.title, i.due?"Due "+fmt(i.due):"", i.owner)), "No new items were added.")}
      ${sec("Updates logged", r.notes.map(x => li(item(x.item).title, x.note, item(x.item).owner)), "No notes were logged.")}
      ${c.real
        ? sec("Still overdue with no status recorded", r.stillUnrec.map(i => li(i.title, i.bucket+" · due "+fmt(i.due), i.owner)), "Every overdue item now has a status.")
        : sec("Still open and still silent", r.stillStalled.map(i => li(i.title, "No update in "+ageDays(i)+" days", i.owner)), "Everything open was touched.")}
      ${sec("Open questions carried forward", r.openQs.map(i => li(i.title, i.bucket, i.owner)), "No open questions.")}
      ${sec("What is due next", r.upcoming.map(i => li(i.title, relDue(i.due), i.owner)), "Nothing dated ahead.")}
    </div>
  </div>`;
}

function recapText(){
  const m = state.meeting, c = club(m.club), r = buildRecap(m), L = [];
  L.push(c.name + (c.plan ? " — " + c.plan : ""));
  L.push("Plan review · " + fmtLong(m.date)); L.push("");
  const block = (t,rows) => { if (!rows.length) return; L.push(t.toUpperCase()); rows.forEach(x => L.push("  - " + x)); L.push(""); };
  block("Decisions made", r.decisions.map(x => item(x.item).title + (x.note ? " — " + x.note : "")));
  block("Closed out", r.closed.map(x => item(x.item).title + " (" + item(x.item).owner + ")"));
  block("Dropped", r.dropped.map(x => item(x.item).title));
  block("New commitments", r.created.map(i => i.title + " — " + i.owner + (i.due ? ", due " + fmt(i.due) : "")));
  block("Updates logged", r.notes.map(x => item(x.item).title + " — " + x.note));
  block(c.real ? "Still overdue with no status recorded" : "Still open and still silent",
    (c.real ? r.stillUnrec : r.stillStalled).map(i => i.title + " — " + i.bucket));
  block("Open questions carried forward", r.openQs.map(i => i.title + " — " + i.bucket));
  block("What is due next", r.upcoming.map(i => i.title + " — " + relDue(i.due)));
  return L.join("\n");
}

/* ---------------- search ---------------- */
function renderSearch(){
  const q = state.q.toLowerCase();
  const hits = db.items.filter(i =>
    i.title.toLowerCase().includes(q) || String(i.owner).toLowerCase().includes(q) ||
    (i.conflict||"").toLowerCase().includes(q) ||
    i.updates.some(u => u.text.toLowerCase().includes(q)));
  const hl = t => esc(t).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<mark>$1</mark>");
  const byClub = {};
  hits.forEach(i => (byClub[i.club] = byClub[i.club] || []).push(i));
  view.innerHTML = `<div class="wrap">
    <div class="pagehead"><div>
      <span class="eyebrow">Search every club, item and note</span>
      <h2>${hits.length} match${hits.length===1?"":"es"} for &ldquo;${esc(state.q)}&rdquo;</h2>
    </div></div>
    ${CLUBS.filter(c => byClub[c.id]).map(c => `<div class="section" style="margin-top:20px">
      <div class="sectionhead"><h3>${esc(c.short)}</h3>
        <span class="note">${byClub[c.id].length} item${byClub[c.id].length===1?"":"s"}${c.real?" · real plan":""}</span></div>
      <div class="panel">${byClub[c.id].map(i => {
        const nh = i.updates.find(u => u.text.toLowerCase().includes(q));
        return `<button class="sresult" data-item="${i.id}">
          <div class="t">${hl(i.title)}</div>
          <div class="c">${esc(i.bucket)} &middot; ${esc(i.owner)} &middot; ${STATUSES[i.status]}</div>
          ${nh ? `<div class="lastnote" style="margin-top:6px"><b>${fmt(nh.date)} &middot; ${esc(nh.who)}</b><br>${hl(nh.text)}</div>` : ""}
        </button>`;
      }).join("")}</div>
    </div>`).join("") || `<div class="panel"><div class="empty">Nothing matched. Try a person's name, a club, a month, or a phrase from a note.</div></div>`}
  </div>`;
}

/* ---------------- drawer ---------------- */
function renderDrawer(){
  const d = document.getElementById("drawer"), sc = document.getElementById("scrim");
  if (!state.drawer){ d.classList.remove("open"); d.setAttribute("aria-hidden","true"); sc.classList.remove("open"); return; }
  const it = item(state.drawer); if (!it) return;
  const c = club(it.club), team = teamOf(it.club);
  const events = [
    {date:it.created, who:it.imported?"Lisa Henrichsen":"", text:it.imported?"Written into the 2026 game plan document":"Added to the game plan", sys:true},
    ...it.updates.map(u => ({...u, sys:false})),
    ...(it.completed ? [{date:it.completed, who:"", text:"Marked "+STATUSES[it.status].toLowerCase(), sys:true}] : [])
  ].sort((a,b) => a.date.localeCompare(b.date));

  d.innerHTML = `
    <div class="drawerhead">
      <div class="top">
        <div>
          <span class="eyebrow">${esc(c.short)} &middot; ${esc(it.bucket)}</span>
          <h3 style="margin-top:6px">${esc(it.title)}</h3>
        </div>
        <button class="btn ghost sm" id="closedrawer" aria-label="Close">Close</button>
      </div>
      <div class="rowmeta">
        <span class="pill ${it.status}">${STATUSES[it.status]}</span>
        ${it.flagged ? `<span class="chip flagged">flagged in source</span>` : ""}
        ${it.due ? `<span class="chip due ${isOverdue(it)?"over":""}">${relDue(it.due)}</span>` : ""}
        ${isStalled(it) ? `<span class="chip stall">silent ${ageDays(it)}d</span>` : ""}
      </div>
    </div>
    <div class="drawerbody">
      ${it.conflict ? `<div class="sourcebox" style="border-left:3px solid var(--crit)">
        <span class="eyebrow">Source conflict</span>${esc(it.conflict)}</div>` : ""}
      ${it.imported ? `<div class="sourcebox">
        <span class="eyebrow">Where this came from</span>
        <code>2026 Game Plan.docx</code> &rarr; ${esc(it.bucket)}. Written ${fmtLong(it.created)} by Lisa Henrichsen.
        ${it.status === "unrecorded" ? "The document never recorded what happened to it." : ""}</div>` : ""}
      <div class="fields">
        <div class="field"><label for="f-status">Status</label>
          <select id="f-status">${Object.keys(STATUSES).map(s => `<option value="${s}" ${s===it.status?"selected":""}>${STATUSES[s]}</option>`).join("")}</select></div>
        <div class="field"><label for="f-type">Kind</label>
          <select id="f-type">${["task","decision","question"].map(t => `<option value="${t}" ${t===it.type?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></div>
        <div class="field"><label for="f-owner">Owner</label>
          <select id="f-owner">${team.map(p => `<option ${p===it.owner?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
        <div class="field"><label for="f-due">Due</label>
          <input id="f-due" type="date" value="${it.due||""}"></div>
      </div>
      <div class="composer">
        <span class="eyebrow">Log an update</span>
        <textarea id="newnote" rows="3" placeholder="What changed? Write it as of today — the title never changes."></textarea>
        <div class="actions">
          <button class="btn primary sm" id="addnote">Add to history</button>
          <label class="chip notes" for="noteWho">heard from</label>
          <select id="noteWho" class="whosel">${team.map(p =>
            `<option ${p==="You (Regional)"?"selected":""}>${esc(p)}</option>`).join("")}</select>
        </div>
      </div>
      <span class="eyebrow" style="display:block; margin-bottom:12px">History</span>
      <div class="timeline">${events.map(e => `<div class="tl ${e.sys?"":"mark"}">
        <div class="when">${fmt(e.date)} &middot; ${daysSince(e.date)}d ago${e.who?` &middot; <span class="who">${esc(e.who)}</span>`:""}</div>
        <div class="what ${e.sys?"sys":""}">${esc(e.text)}</div>
      </div>`).join("")}</div>
    </div>`;
  d.classList.add("open"); d.setAttribute("aria-hidden","false"); sc.classList.add("open");
}

/* ---------------- actions ---------------- */
function record(id, patch, note, who){
  const it = item(id); if (!it) return;
  const from = it.status;
  Object.assign(it, patch);
  if (patch.status === "done" && !it.completed) it.completed = iso(TODAY);
  if (patch.status && patch.status !== "done") it.completed = null;
  if (note) it.updates.push({date:iso(TODAY), who:who || "You (Regional)", text:note});
  if (state.meeting && state.meeting.club === it.club && (note || (patch.status && patch.status !== from)))
    state.meeting.changes.push({item:id, from, to:patch.status || from, note:note || ""});
  save();
}

function render(){
  renderRail();
  if (state.q.trim().length > 1) renderSearch();
  else if (state.view === "meeting") renderMeeting();
  else if (state.view === "recap") renderRecap();
  else if (state.view === "calendar") renderCalendar();
  else if (state.view === "club") renderClub();
  else renderPortfolio();
  renderDrawer();
  document.getElementById("topbar").style.display = state.view === "meeting" ? "none" : "";
}

function openClub(id){
  state.club = id; state.view = "club"; state.month = null;
  state.filter = club(id).real ? "all" : "open";
  state.q = ""; document.getElementById("q").value = "";
  render(); window.scrollTo(0,0);
}

function addItemPrompt(inMeeting){
  const cid = inMeeting ? state.meeting.club : state.club, c = club(cid);
  const title = prompt("What is the item?");
  if (!title || !title.trim()) return;
  const buckets = c.buckets.concat(c.calendar ? MONTHS : []);
  const bi = prompt("Where does it go?\n\n" + buckets.map((b,i)=>(i+1)+". "+b).join("\n"), "1");
  const b = buckets[(parseInt(bi,10)||1)-1] || buckets[0];
  const team = teamOf(cid);
  const oi = prompt("Who owns it?\n\n" + team.map((p,i)=>(i+1)+". "+p).join("\n"), "1");
  const o = team[(parseInt(oi,10)||1)-1] || team[0];
  const it = {
    id:"n"+Date.now().toString(36), club:cid, bucket:b, track:isMonth(b)?"calendar":"program",
    parent:null, title:title.trim(), type:"task", owner:o, status:"not_started",
    created:iso(TODAY), due:null, completed:null, flagged:false, conflict:null, imported:false,
    updates:[{date:iso(TODAY), who:"You (Regional)", text:"Added during the " + (inMeeting?"review":"plan edit") + "."}]
  };
  db.items.push(it);
  if (inMeeting && state.meeting){ state.meeting.created = state.meeting.created || []; state.meeting.created.push(it.id); }
  save(); render(); toast("Added to " + b);
}

document.addEventListener("click", e => {
  const hit = sel => e.target.closest(sel);

  if (hit('[data-nav="portfolio"]')){
    state.view="portfolio"; state.club=null; state.month=null; state.q="";
    document.getElementById("q").value=""; render(); window.scrollTo(0,0); return;
  }
  const cb = hit("[data-club]"); if (cb){ state.meeting = state.meeting && state.view==="recap" ? null : state.meeting; openClub(cb.dataset.club); return; }
  const card = hit("[data-open]"); if (card){ openClub(card.dataset.open); return; }
  const mo = hit("[data-month]"); if (mo){
    state.view="calendar"; state.month=mo.dataset.month; state.filter="all";
    render(); window.scrollTo(0,0); return;
  }
  const f = hit("[data-filter]"); if (f){ state.filter = f.dataset.filter; render(); return; }
  const bk = hit("[data-bucket]"); if (bk){
    const k = state.club + bk.dataset.bucket;
    state.collapsed[k] = !state.collapsed[k]; render(); return;
  }

  if (hit("#closedrawer") || hit("#scrim")){ state.drawer = null; renderDrawer(); return; }
  const oi = hit("[data-open-item]"); if (oi){ state.drawer = oi.dataset.openItem; renderDrawer(); return; }
  const row = hit("[data-item]"); if (row && !hit(".statusgroup") && !hit(".notefield")){
    state.drawer = row.dataset.item; renderDrawer(); return; }

  if (hit("#addnote")){
    const v = document.getElementById("newnote").value.trim(); if (!v) return;
    record(state.drawer, {}, v, (document.getElementById("noteWho")||{}).value);
    render(); toast("Logged to history"); return;
  }
  if (hit("#addbtn")){ addItemPrompt(false); return; }
  if (hit("#meetadd")){ addItemPrompt(true); return; }
  if (hit("#startmeet")){
    state.meeting = {club:state.club, date:iso(TODAY), changes:[], created:[]};
    state.view = "meeting"; state.drawer = null; render(); window.scrollTo(0,0); return;
  }
  const set = hit("[data-set]"); if (set){
    const p = set.dataset.set.split("|"); record(p[0], {status:p[1]}); render(); return;
  }
  const sn = hit("[data-savenote]"); if (sn){
    const input = document.querySelector('[data-note="'+sn.dataset.savenote+'"]');
    const v = input.value.trim(); if (!v) return;
    record(sn.dataset.savenote, {}, v, (document.querySelector('[data-who="'+sn.dataset.savenote+'"]')||{}).value);
    render(); toast("Logged"); return;
  }
  if (hit("#meetend")){
    const m = state.meeting;
    db.meetings.push({id:"m"+Date.now(), club:m.club, date:m.date, kind:"Plan review", changes:m.changes, closed:true});
    save(); state.view = "recap"; render(); window.scrollTo(0,0); return;
  }
  if (hit("#copyrecap")){
    navigator.clipboard.writeText(recapText()).then(
      () => toast("Recap copied — paste it into the follow-up email"),
      () => toast("Copy blocked by the browser"));
    return;
  }
  if (hit("#resetbtn")){
    if (confirm("Discard every status and note added here and restore all seven plans as they were imported?")){
      db = buildSeed(); save(); state.meeting=null; state.drawer=null;
      state.view="portfolio"; state.club=null; render(); toast("All plans reset");
    }
    return;
  }
  if (hit("#themebtn")){
    const root = document.documentElement, cur = root.getAttribute("data-theme");
    const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("clubplans.theme", next); } catch(err){}
    return;
  }
});

document.addEventListener("change", e => {
  if (!state.drawer) return;
  const id = state.drawer, t = e.target;
  if (t.id === "f-status"){ record(id, {status:t.value}); render(); }
  if (t.id === "f-type"){ record(id, {type:t.value}); render(); }
  if (t.id === "f-owner"){ record(id, {owner:t.value}); render(); }
  if (t.id === "f-due"){ record(id, {due:t.value || null}); render(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.drawer){ state.drawer = null; renderDrawer(); }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.note){
    const v = e.target.value.trim(); if (!v) return;
    record(e.target.dataset.note, {}, v, (document.querySelector('[data-who="'+e.target.dataset.note+'"]')||{}).value);
    render(); toast("Logged");
  }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("row")){
    state.drawer = e.target.dataset.item; renderDrawer();
  }
});

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
try { const th = localStorage.getItem("clubplans.theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

render();
</script>
