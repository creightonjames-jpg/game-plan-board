<title>Game Plan Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">

<style>
:root{
  --paper:#F2F4F4;
  --surface:#FFFFFF;
  --surface-2:#E9EDEE;
  --surface-3:#DEE4E5;
  --line:#D5DCDD;
  --line-soft:#E4E9EA;
  --ink:#101A1C;
  --ink-2:#4A5A5C;
  --ink-3:#7C8B8D;
  --accent:#14606F;
  --accent-hover:#0E4A56;
  --accent-soft:#DEEDEF;
  --accent-line:#9CC4CB;
  --ok:#2F7A4F;
  --ok-soft:#DFF0E5;
  --warn:#9A7318;
  --warn-soft:#F6EBD2;
  --crit:#A93B2A;
  --crit-soft:#F7E2DE;
  --on-accent:#FFFFFF;
  --on-solid:#FFFFFF;
  --bar-bg:#101A1C;
  --bar-fg:#F2F4F4;
  --shadow:0 1px 2px rgba(16,26,28,.05), 0 8px 24px -12px rgba(16,26,28,.18);
  --shadow-lg:0 24px 60px -20px rgba(16,26,28,.35);
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1517;
    --surface:#151E20;
    --surface-2:#1D2729;
    --surface-3:#263234;
    --line:#2C3A3D;
    --line-soft:#232F31;
    --ink:#E7EDED;
    --ink-2:#9BAAAC;
    --ink-3:#6C7C7E;
    --accent:#4FB6C9;
    --accent-hover:#78CBDA;
    --accent-soft:#123239;
    --accent-line:#2A5A66;
    --ok:#63C08A;
    --ok-soft:#132B20;
    --warn:#D7A63F;
    --warn-soft:#2E2617;
    --crit:#E58771;
    --crit-soft:#33201B;
    --on-accent:#08191D;
    --on-solid:#0E1517;
    --bar-bg:#1D2729;
    --bar-fg:#E7EDED;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1517;
  --surface:#151E20;
  --surface-2:#1D2729;
  --surface-3:#263234;
  --line:#2C3A3D;
  --line-soft:#232F31;
  --ink:#E7EDED;
  --ink-2:#9BAAAC;
  --ink-3:#6C7C7E;
  --accent:#4FB6C9;
  --accent-hover:#78CBDA;
  --accent-soft:#123239;
  --accent-line:#2A5A66;
  --ok:#63C08A;
  --ok-soft:#132B20;
  --warn:#D7A63F;
  --warn-soft:#2E2617;
  --crit:#E58771;
  --crit-soft:#33201B;
  --on-accent:#08191D;
  --on-solid:#0E1517;
  --bar-bg:#1D2729;
  --bar-fg:#E7EDED;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance}
p{margin:0}
ul{margin:0; padding:0; list-style:none}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500;
}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh}

.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px;
  padding:20px 14px 24px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:0 8px 18px; border-bottom:1px solid var(--line-soft); margin-bottom:14px}
.brand h1{
  font-family:var(--display); font-size:21px; font-weight:600;
  letter-spacing:-.015em; line-height:1.1;
}
.brand .sub{margin-top:5px; font-size:11.5px; color:var(--ink-3)}

.railhead{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 8px 6px;
}
.navitem{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 8px; border-radius:var(--r); color:var(--ink-2); font-size:13.5px;
}
.navitem:hover{background:var(--surface-2); color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.navitem .dot{
  width:7px; height:7px; border-radius:50%; flex:none;
  background:var(--ink-3); opacity:.5;
}
.navitem[aria-current="true"] .dot{background:var(--accent); opacity:1}
.navitem .count{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.navitem .count.flag{color:var(--crit); font-weight:600}
.railfoot{margin-top:auto; padding:16px 8px 0; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:8px}
.linkbtn{font-size:11.5px; color:var(--ink-3); text-align:left}
.linkbtn:hover{color:var(--accent); text-decoration:underline}

/* ---------- main ---------- */
main{min-width:0; padding:0 0 80px}
.topbar{
  display:flex; align-items:center; gap:12px; padding:16px 32px;
  border-bottom:1px solid var(--line); background:var(--paper);
  position:sticky; top:0; z-index:20;
}
.search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:6px 10px;
}
.search input{border:none; background:none; outline:none; width:100%; font-size:13.5px}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none; color:var(--ink-3)}
.topbar .spacer{flex:1}

.wrap{padding:28px 32px; max-width:1180px}
.pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:24px}
.pagehead h2{font-family:var(--display); font-size:28px; letter-spacing:-.02em; line-height:1.15}
.pagehead .meta{margin-top:6px; color:var(--ink-2); font-size:13px}

/* buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  font-size:13px; font-weight:500; color:var(--ink); white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:4px 9px; font-size:12px}

/* ---------- stat strip ---------- */
.stats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; margin-bottom:28px;
}
.stat{background:var(--surface); padding:14px 16px; border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--mono); font-size:26px; font-weight:500; letter-spacing:-.02em; line-height:1.1}
.stat .l{margin-top:4px; font-size:11.5px; color:var(--ink-2)}
.stat.warn .n{color:var(--warn)}
.stat.crit .n{color:var(--crit)}
.stat.ok .n{color:var(--ok)}

/* ---------- club cards ---------- */
.clubgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px}
.clubcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 16px 14px; text-align:left; display:flex; flex-direction:column; gap:12px;
  transition:border-color .12s, transform .12s;
}
.clubcard:hover{border-color:var(--accent-line); transform:translateY(-1px)}
.clubcard .name{font-family:var(--display); font-size:17.5px; font-weight:600; letter-spacing:-.01em; line-height:1.2}
.clubcard .where{margin-top:3px; font-size:11.5px; color:var(--ink-3)}
.clubcard .gm{font-size:12.5px; color:var(--ink-2)}
.tag{
  display:inline-block; padding:1.5px 6px; border-radius:4px; font-family:var(--mono);
  font-size:10px; letter-spacing:.04em; text-transform:uppercase; font-weight:500;
  border:1px solid var(--line); color:var(--ink-2); background:var(--surface-2);
}
.cardstats{display:flex; gap:16px; border-top:1px solid var(--line-soft); padding-top:11px}
.cardstats > div:not(.spark){display:flex; flex-direction:column; gap:1px}
.cardstats .v{font-family:var(--mono); font-size:15px; font-weight:500}
.cardstats .k{font-size:10.5px; color:var(--ink-3)}
.cardstats .v.warn{color:var(--warn)} .cardstats .v.crit{color:var(--crit)} .cardstats .v.ok{color:var(--ok)}
.spark{display:flex; flex-direction:row; align-items:flex-end; gap:3px; height:26px; margin-left:auto; flex:none}
.spark i{
  width:7px; height:100%; border-radius:2px; display:flex; align-items:flex-end;
  background:var(--surface-3); overflow:hidden;
}
.spark i b{display:block; width:100%; background:var(--accent-line); border-radius:2px; min-height:2px}
.spark i:last-child b{background:var(--accent)}
.meetline{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); font-family:var(--mono)}

/* ---------- section ---------- */
.section{margin-top:34px}
.sectionhead{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.sectionhead h3{font-size:14.5px; letter-spacing:-.005em}
.sectionhead .note{font-size:12px; color:var(--ink-3)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.panel .empty{padding:26px; text-align:center; color:var(--ink-3); font-size:13px}

/* ---------- item rows ---------- */
.bucket{border-bottom:1px solid var(--line); background:var(--surface)}
.bucket:last-child{border-bottom:none}
.buckethead{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 16px; background:var(--surface-2);
  border-bottom:1px solid var(--line-soft);
}
.buckethead:hover{background:var(--surface-3)}
.buckethead h4{font-size:12.5px; font-weight:600; letter-spacing:.01em}
.buckethead .chev{color:var(--ink-3); transition:transform .15s; flex:none}
.buckethead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.buckethead .tally{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.progress{width:64px; height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; flex:none}
.progress i{display:block; height:100%; background:var(--ok)}

.row{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  padding:9px 16px 9px 0; border-bottom:1px solid var(--line-soft);
  position:relative; border-left:3px solid transparent;
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row.sev-warn{border-left-color:var(--warn)}
.row.sev-crit{border-left-color:var(--crit)}
.row.is-done .title{color:var(--ink-3)}
.row.is-dropped .title{color:var(--ink-3); text-decoration:line-through}
.row .indent{flex:none}
.marker{
  flex:none; width:17px; height:17px; margin-top:1px; border-radius:4px;
  border:1.5px solid var(--ink-3); display:grid; place-items:center;
  color:var(--surface); background:var(--surface);
}
.marker:hover{border-color:var(--accent)}
.marker.done{background:var(--ok); border-color:var(--ok); color:var(--on-solid)}
.marker.decision{border-radius:0; transform:rotate(45deg); width:14px; height:14px; margin-top:2px}
.marker.decision.done{background:var(--accent); border-color:var(--accent)}
.marker.question{border-radius:50%; border-color:var(--warn); color:var(--warn); font-size:11px; font-weight:700; font-family:var(--mono)}
.marker.question.done{background:var(--warn); color:var(--on-solid)}
.rowbody{flex:1; min-width:0}
.row .title{font-size:13.5px; line-height:1.45}
.rowmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px}
.chip{
  display:inline-flex; align-items:center; gap:4px; font-size:11px;
  color:var(--ink-2); font-family:var(--mono);
}
.chip.owner{color:var(--ink-2)}
.chip.due.over{color:var(--crit); font-weight:600}
.chip.stall{color:var(--warn); font-weight:600}
.chip.notes{color:var(--ink-3)}
.pill{
  flex:none; font-size:10.5px; font-family:var(--mono); letter-spacing:.03em;
  text-transform:uppercase; padding:2px 7px; border-radius:20px; white-space:nowrap;
  border:1px solid transparent; margin-top:2px;
}
.pill.not_started{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.pill.in_progress{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.pill.done{background:var(--ok-soft); color:var(--ok)}
.pill.parked{background:var(--warn-soft); color:var(--warn)}
.pill.dropped{background:var(--surface-2); color:var(--ink-3); border-color:var(--line)}
.lastnote{
  margin-top:5px; font-size:12.5px; color:var(--ink-2); line-height:1.45;
  border-left:2px solid var(--line); padding-left:9px;
}
.lastnote b{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--ink-3)}

/* filters */
.filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.fchip{
  padding:4px 11px; border-radius:20px; border:1px solid var(--line);
  background:var(--surface); font-size:12px; color:var(--ink-2);
}
.fchip:hover{border-color:var(--ink-3)}
.fchip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.fchip .n{font-family:var(--mono); font-size:11px; opacity:.65; margin-left:4px}

/* attention table */
.att{width:100%; border-collapse:collapse}
.att th{
  text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500;
  padding:9px 14px; border-bottom:1px solid var(--line); background:var(--surface-2);
}
.att td{padding:10px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-size:13px}
.att tr:last-child td{border-bottom:none}
.att tbody tr{cursor:pointer}
.att tbody tr:hover{background:var(--surface-2)}
.att .club{font-size:12px; color:var(--ink-2); white-space:nowrap}
.att .num{font-family:var(--mono); font-size:12px; white-space:nowrap}
.att .num.crit{color:var(--crit); font-weight:600}
.att .num.warn{color:var(--warn); font-weight:600}
.tablewrap{overflow-x:auto}

/* ---------- drawer ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(16,26,28,.4); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(480px,100vw);
  background:var(--surface); border-left:1px solid var(--line); z-index:50;
  transform:translateX(102%); transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
}
.drawer.open{transform:none}
.drawerhead{padding:18px 20px 14px; border-bottom:1px solid var(--line)}
.drawerhead .top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px}
.drawerhead h3{font-size:16px; line-height:1.35; letter-spacing:-.005em}
.drawerbody{flex:1; overflow-y:auto; padding:18px 20px 28px}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.field select,.field input{
  border:1px solid var(--line); background:var(--surface); border-radius:6px;
  padding:6px 8px; font-size:13px; outline:none; width:100%;
}
.field select:focus,.field input:focus,textarea:focus{border-color:var(--accent)}
textarea{
  border:1px solid var(--line); background:var(--surface); border-radius:6px;
  padding:9px 10px; font-size:13.5px; outline:none; width:100%; resize:vertical;
  font-family:var(--sans); line-height:1.5;
}
.composer{display:flex; flex-direction:column; gap:8px; margin-bottom:24px}
.composer .actions{display:flex; gap:8px; align-items:center}

.timeline{position:relative; padding-left:20px}
.timeline::before{content:""; position:absolute; left:4.5px; top:5px; bottom:5px; width:1px; background:var(--line)}
.tl{position:relative; padding-bottom:18px}
.tl::before{
  content:""; position:absolute; left:-20px; top:5px; width:9px; height:9px;
  border-radius:50%; background:var(--surface); border:2px solid var(--line-soft);
  box-shadow:0 0 0 3px var(--surface);
}
.tl.mark::before{background:var(--accent); border-color:var(--accent)}
.tl .when{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.tl .who{font-size:11.5px; color:var(--ink-2); font-weight:600}
.tl .what{font-size:13.5px; margin-top:3px; line-height:1.5}
.tl .what.sys{color:var(--ink-2); font-style:italic}

/* ---------- meeting mode ---------- */
.meetbar{
  background:var(--bar-bg); color:var(--bar-fg); padding:12px 32px;
  display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:25;
  box-shadow:inset 0 -2px 0 var(--accent);
}
.meetbar .live{
  display:inline-flex; align-items:center; gap:7px; font-family:var(--mono);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
}
.meetbar .live i{width:7px; height:7px; border-radius:50%; background:var(--crit); display:block}
@media (prefers-reduced-motion:no-preference){.meetbar .live i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.meetbar .who{font-family:var(--display); font-size:16px; font-weight:600}
.meetbar .tally{margin-left:auto; font-family:var(--mono); font-size:12px; opacity:.7}
.meetbar .btn{background:transparent; border-color:color-mix(in srgb, var(--bar-fg) 32%, transparent); color:var(--bar-fg)}
.meetbar .btn:hover{background:color-mix(in srgb, var(--bar-fg) 12%, transparent); border-color:var(--bar-fg)}
.meetbar .btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.meetbar .btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}

.mrow{
  display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line-soft);
  border-left:3px solid transparent; align-items:flex-start;
}
.mrow:last-child{border-bottom:none}
.mrow.sev-warn{border-left-color:var(--warn)} .mrow.sev-crit{border-left-color:var(--crit)}
.mrow.touched{background:var(--accent-soft)}
.mrow .mbody{flex:1; min-width:0}
.mrow .mtitle{font-size:14px; line-height:1.4}
.statusgroup{display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex:none}
.statusgroup button{
  padding:4px 8px; font-size:11px; font-family:var(--mono); color:var(--ink-2);
  border-right:1px solid var(--line); background:var(--surface);
}
.statusgroup button:last-child{border-right:none}
.statusgroup button:hover{background:var(--surface-2)}
.statusgroup button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.notefield{
  margin-top:8px; display:flex; gap:8px; align-items:center;
}
.notefield input{
  flex:1; border:1px solid var(--line); background:var(--surface); border-radius:6px;
  padding:6px 9px; font-size:13px; outline:none;
}
.notefield input:focus{border-color:var(--accent)}
.whosel{
  border:1px solid var(--line); background:var(--surface); border-radius:6px;
  padding:5px 7px; font-size:11.5px; font-family:var(--mono); color:var(--ink-2);
  outline:none; max-width:190px;
}
.whosel:focus{border-color:var(--accent)}

/* ---------- recap ---------- */
.recap{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:36px 40px; max-width:760px;
}

  {c:"cr", d:12, kind:"Club visit"}, {c:"cr", d:47, kind:"Club visit"}, {c:"cr", d:61, kind:"Club visit"}, {c:"cr", d:96, kind:"Club visit"},

/* ============================================================
   Build state
   ============================================================ */

const STALL_DAYS = 30;
const STATUSES = {not_started:"Not started", in_progress:"In progress", done:"Done", parked:"Parked", dropped:"Dropped"};
const OPEN = s => s === "not_started" || s === "in_progress";

function buildSeed(){
  const keyed = {}, items = [];
  SEED.forEach((s, i) => {
    const id = s.c + "-" + String(i).padStart(3,"0");
    if (s.k) keyed[s.c + ":" + s.k] = id;
    items.push({
      id, club:s.c, bucket:s.b, _pkey: s.p ? s.c + ":" + s.p : null, parent:null,
      title:s.t, type:s.ty || "task", owner:s.o, status:s.s,
      created:ago(s.cr), due: s.du === undefined ? null : (s.du >= 0 ? ahead(s.du) : ago(-s.du)),
      completed: s.dn === undefined ? null : ago(s.dn),
      updates:(s.u || []).map(u => ({date:ago(u[0]), who:u[1], text:u[2]}))
    });
  });
  items.forEach(it => { if (it._pkey) it.parent = keyed[it._pkey] || null; delete it._pkey; });
  const meetings = MEETING_LOG.map((m,i) => ({id:"m"+i, club:m.c, date:ago(m.d), kind:m.kind, changes:[], closed:true}));
  return {items, meetings, v:1};
}

const KEY = "gpb.demo.v1";
let db;
try {
  const raw = localStorage.getItem(KEY);
  db = raw ? JSON.parse(raw) : buildSeed();
  if (!db || !db.items || db.v !== 1) db = buildSeed();
} catch(e){ db = buildSeed(); }

function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }

const state = {view:"portfolio", club:null, filter:"open", q:"", drawer:null, meeting:null};

/* ---------- derived ---------- */
const club = id => CLUBS.find(c => c.id === id);
const item = id => db.items.find(i => i.id === id);
const lastTouch = it => {
  const u = it.updates.length ? it.updates[it.updates.length-1].date : it.created;
  return it.completed && it.completed > u ? it.completed : u;
};
const ageDays = it => daysSince(lastTouch(it));
const isStalled = it => OPEN(it.status) && ageDays(it) >= STALL_DAYS;
const isOverdue = it => OPEN(it.status) && it.due && daysSince(it.due) > 0;
const severity = it => isOverdue(it) ? "crit" : isStalled(it) ? "warn" : null;
const carryOver = it => db.meetings.filter(m => m.club === it.club && m.closed && m.date > it.created).length;
const clubItems = id => db.items.filter(i => i.club === id);
const meetingsFor = id => db.meetings.filter(m => m.club === id && m.closed).sort((a,b) => b.date.localeCompare(a.date));

function clubStats(id){
  const list = clubItems(id);
  return {
    total:list.length,
    open:list.filter(i => OPEN(i.status)).length,
    stalled:list.filter(isStalled).length,
    overdue:list.filter(isOverdue).length,
    closed30:list.filter(i => i.completed && daysSince(i.completed) <= 30).length,
    done:list.filter(i => i.status === "done").length,
    questions:list.filter(i => i.type === "question" && OPEN(i.status)).length
  };
}
function momentum(id){
  const list = clubItems(id).filter(i => i.completed);
  return [4,3,2,1,0].map(b => list.filter(i => {
    const d = daysSince(i.completed);
    return d >= b*30 && d < (b+1)*30;
  }).length);
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short", day:"numeric"});
const fmtLong = d => new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"});
function relDue(d){
  const n = daysSince(d);
  if (n === 0) return "due today";
  return n > 0 ? n + "d overdue" : "due " + fmt(d);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- club board ---------- */
function itemRow(it, depth){
  const sev = severity(it);
  const kids = db.items.filter(k => k.parent === it.id);
  const note = it.updates.length ? it.updates[it.updates.length-1] : null;
  const co = carryOver(it);
  const mark = it.type === "decision"
    ? `<span class="marker decision ${it.status==="done"?"done":""}"></span>`
    : it.type === "question"
      ? `<span class="marker question ${it.status==="done"?"done":""}">?</span>`
      : `<span class="marker ${it.status==="done"?"done":""}">${it.status==="done"
        ? '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 4.8 8.5 9.5 3.6"/></svg>' : ""}</span>`;
  return `<div class="row ${sev?"sev-"+sev:""} is-${it.status}" data-item="${it.id}" tabindex="0" role="button">
      <span class="indent" style="width:${16 + depth*22}px"></span>
      ${mark}
      <div class="rowbody">
        <div class="title">${esc(it.title)}</div>
        <div class="rowmeta">
          <span class="chip owner">${esc(it.owner)}</span>
          ${it.due && OPEN(it.status) ? `<span class="chip due ${isOverdue(it)?"over":""}">${relDue(it.due)}</span>` : ""}
          ${isStalled(it) ? `<span class="chip stall">silent ${ageDays(it)}d</span>` : ""}
          ${OPEN(it.status) && co >= 2 ? `<span class="chip notes">carried ${co} meetings</span>` : ""}
          ${it.updates.length ? `<span class="chip notes">${it.updates.length} note${it.updates.length>1?"s":""}</span>` : ""}
        </div>
        ${note ? `<div class="lastnote"><b>${fmt(note.date)} &middot; ${esc(note.who)}</b><br>${esc(note.text)}</div>` : ""}
      </div>
      <span class="pill ${it.status}">${STATUSES[it.status]}</span>
    </div>` + kids.map(k => itemRow(k, depth+1)).join("");
}

function filterItems(list){
  if (state.filter === "open") return list.filter(i => OPEN(i.status));
  if (state.filter === "attention") return list.filter(i => isStalled(i) || isOverdue(i));
  if (state.filter === "questions") return list.filter(i => i.type === "question");
  if (state.filter === "decisions") return list.filter(i => i.type === "decision");
  if (state.filter === "mine") return list.filter(i => i.owner.startsWith("You"));
  return list;
}

function renderClub(){
  const c = club(state.club), s = clubStats(c.id), all = clubItems(c.id);
  const keep = new Set(filterItems(all).map(i => i.id));
  // keep ancestors of any matching child so the outline stays intact
  all.forEach(i => { if (keep.has(i.id)) { let p = i.parent; while (p){ keep.add(p); p = (item(p)||{}).parent; } } });
  const shown = all.filter(i => keep.has(i.id));
  const past = meetingsFor(c.id);

  const counts = {
    all: all.length,
    open: all.filter(i => OPEN(i.status)).length,
    attention: all.filter(i => isStalled(i) || isOverdue(i)).length,
    questions: all.filter(i => i.type === "question").length,
    decisions: all.filter(i => i.type === "decision").length,
    mine: all.filter(i => i.owner.startsWith("You")).length
  };
  const F = [["open","Open"],["attention","Needs attention"],["questions","Questions"],["decisions","Decisions"],["mine","Mine"],["all","Everything"]];

  view.innerHTML = `<div class="wrap">
    <div class="pagehead">
      <div>
        <span class="eyebrow">${esc(c.kind)} &middot; ${esc(c.loc)} &middot; ${esc(c.gm)}</span>
        <h2>${esc(c.name)}</h2>
        <p class="meta">${s.open} open &middot; ${s.overdue} overdue &middot; ${s.stalled} stalled &middot; last met ${past.length?fmt(past[0].date)+" ("+past[0].kind.toLowerCase()+")":"—"} &middot; next in ${c.next} days</p>
      </div>
      <div style="display:flex; gap:8px">
        <button class="btn" id="addbtn">Add item</button>
        <button class="btn primary" id="startmeet">Start meeting</button>
      </div>
    </div>

    <div class="filters">${F.map(([k,l]) =>
      `<button class="fchip" data-filter="${k}" aria-pressed="${state.filter===k}">${l}<span class="n">${counts[k]}</span></button>`).join("")}
    </div>

    <div class="panel">${BUCKETS.map(b => {
      const roots = shown.filter(i => i.bucket === b && !i.parent);
      if (!roots.length) return "";
      const bAll = all.filter(i => i.bucket === b);
      const bDone = bAll.filter(i => i.status === "done" || i.status === "dropped").length;
      const pct = bAll.length ? Math.round(bDone/bAll.length*100) : 0;
      const collapsed = state.collapsed && state.collapsed[c.id+b];
      return `<div class="bucket">
        <button class="buckethead" data-bucket="${esc(b)}" aria-expanded="${!collapsed}">
          <svg class="chev" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          <h4>${esc(b)}</h4>
          <span class="tally">${bDone}/${bAll.length}</span>
          <span class="progress"><i style="width:${pct}%"></i></span>
        </button>
        ${collapsed ? "" : roots.map(i => itemRow(i,0)).join("")}
      </div>`;
    }).join("") || `<div class="empty">Nothing matches this filter.</div>`}</div>

    <div class="section">
      <div class="sectionhead"><h3>Meeting history</h3><span class="note">Every checkpoint over the same living plan</span></div>
      <div class="panel">${past.map(m => `<div class="sresult" style="cursor:default">
        <div class="t">${esc(m.kind)} &mdash; ${fmtLong(m.date)}</div>
        <div class="c">${daysSince(m.date)} days ago${m.changes && m.changes.length ? " &middot; " + m.changes.length + " changes recorded" : ""}</div>
      </div>`).join("")}</div>
    </div>
  </div>`;
}

            <span class="chip owner">${esc(i.owner)}</span>
            <span class="chip notes">${esc(i.bucket)}</span>
            ${i.due ? `<span class="chip due ${isOverdue(i)?"over":""}">${relDue(i.due)}</span>` : ""}
            ${isStalled(i) ? `<span class="chip stall">silent ${ageDays(i)}d</span>` : ""}
          </div>
          <div class="notefield">
            <input type="text" placeholder="What did you land on?" data-note="${i.id}">
            <select class="whosel" data-who="${i.id}" aria-label="Who said it">${
              c.team.map(p => `<option ${p === i.owner ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
            <button class="btn sm" data-savenote="${i.id}">Log</button>
            <button class="btn sm ghost" data-open-item="${i.id}">History</button>
          </div>
        </div>
        <div class="statusgroup">
          ${["not_started","in_progress","done","parked"].map(s =>
            `<button data-set="${i.id}|${s}" aria-pressed="${i.status===s}">${
              {not_started:"open",in_progress:"working",done:"done",parked:"park"}[s]}</button>`).join("")}
        </div>
      </div>`;
    }).join("") || `<div class="empty">Nothing open. Enjoy it while it lasts.</div>`}</div>

    ${newOnes.length ? `<div class="section">
      <div class="sectionhead"><h3>Added in this meeting</h3></div>
      <div class="panel">${newOnes.map(i => `<div class="sresult" style="cursor:default">
        <div class="t">${esc(i.title)}</div><div class="c">${esc(i.owner)} &middot; ${esc(i.bucket)}</div></div>`).join("")}</div>
    </div>` : ""}
  </div>`;
}

/* ---------- recap ---------- */
function buildRecap(m){
  const changes = m.changes;
  const seen = id => item(id);
  const decisions = changes.filter(ch => ch.note && (seen(ch.item)||{}).type === "decision");
  const closed = changes.filter(ch => ch.to === "done");
  const parked = changes.filter(ch => ch.to === "parked");
  const notes = changes.filter(ch => ch.note && !decisions.includes(ch));
  const created = (m.created||[]).map(seen).filter(Boolean);
  const all = clubItems(m.club);
  const stillStalled = all.filter(i => isStalled(i) && !changes.some(ch => ch.item === i.id));
  const openQs = all.filter(i => i.type === "question" && OPEN(i.status));
  const commitments = all.filter(i => OPEN(i.status) && i.due).sort((a,b) => a.due.localeCompare(b.due)).slice(0,10);
  return {decisions, closed, parked, notes, created, stillStalled, openQs, commitments};
}

function renderRecap(){
  const m = state.meeting, c = club(m.club), r = buildRecap(m);
  const li = (t, sub, own) => `<li>${esc(t)}${sub?`<span class="sub">${esc(sub)}</span>`:""}${own?`<span class="sub own">${esc(own)}</span>`:""}</li>`;
  const sec = (title, rows, empty) => `<section><h3>${title}</h3>${
    rows.length ? `<ul>${rows.join("")}</ul>` : `<p class="none">${empty}</p>`}</section>`;

  view.innerHTML = `<div class="wrap">
    <div class="pagehead">
      <div><span class="eyebrow">Generated from the meeting</span><h2>Recap</h2>
      <p class="meta">Every line below came from a status change or a note logged during the call. Nothing retyped.</p></div>
      <div style="display:flex; gap:8px">
        <button class="btn" id="copyrecap">Copy as text</button>
        <button class="btn" onclick="window.print()">Print</button>
        <button class="btn primary" id="backtoclub">Back to the plan</button>
      </div>
    </div>
    <div class="recap" id="recapdoc">
      <h2>${esc(c.name)}</h2>
      <div class="rmeta">Game plan review &middot; ${fmtLong(m.date)} &middot; ${esc(c.gm)} and regional support</div>
      ${sec("Decisions made", r.decisions.map(ch => li(item(ch.item).title, ch.note)), "No decisions were recorded in this meeting.")}
      ${sec("Closed out", r.closed.map(ch => li(item(ch.item).title, ch.note || "", item(ch.item).owner)), "Nothing was closed in this meeting.")}
      ${sec("New commitments", r.created.map(i => li(i.title, i.due ? "Due " + fmt(i.due) : "", i.owner)), "No new items were added.")}
      ${sec("Updates logged", r.notes.map(ch => li(item(ch.item).title, ch.note, item(ch.item).owner)), "No notes were logged.")}
      ${sec("Parked", r.parked.map(ch => li(item(ch.item).title, ch.note || "")), "Nothing was parked.")}
      ${sec("Still open and still silent", r.stillStalled.map(i => li(i.title, "No update in " + ageDays(i) + " days", i.owner)), "Everything open was touched.")}
      ${sec("Open questions carried forward", r.openQs.map(i => li(i.title, "", i.owner)), "No open questions.")}
      ${sec("What is due next", r.commitments.map(i => li(i.title, relDue(i.due), i.owner)), "Nothing has a date on it, which is its own problem.")}
    </div>
  </div>`;
}

function recapText(){
  const m = state.meeting, c = club(m.club), r = buildRecap(m);
  const L = [];
  L.push(c.name + " — game plan review");
  L.push(fmtLong(m.date));
  L.push("");
  const block = (t, rows) => { if (!rows.length) return; L.push(t.toUpperCase()); rows.forEach(x => L.push("  - " + x)); L.push(""); };
  block("Decisions made", r.decisions.map(ch => item(ch.item).title + (ch.note ? " — " + ch.note : "")));
  block("Closed out", r.closed.map(ch => item(ch.item).title + " (" + item(ch.item).owner + ")"));
  block("New commitments", r.created.map(i => i.title + " — " + i.owner + (i.due ? ", due " + fmt(i.due) : "")));
  block("Updates logged", r.notes.map(ch => item(ch.item).title + " — " + ch.note));
  block("Parked", r.parked.map(ch => item(ch.item).title));
  block("Still open and still silent", r.stillStalled.map(i => i.title + " — no update in " + ageDays(i) + " days (" + i.owner + ")"));
  block("Open questions carried forward", r.openQs.map(i => i.title + " — " + i.owner));
  block("What is due next", r.commitments.map(i => i.title + " — " + i.owner + ", " + relDue(i.due)));
  return L.join("\n");
}

/* ---------- search ---------- */
function renderSearch(){
  const q = state.q.toLowerCase();
  const hits = db.items.filter(i =>
    i.title.toLowerCase().includes(q) ||
    i.owner.toLowerCase().includes(q) ||
    i.updates.some(u => u.text.toLowerCase().includes(q)));
  const hl = t => esc(t).replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig"), "<mark>$1</mark>");
  const byClub = {};
  hits.forEach(i => (byClub[i.club] = byClub[i.club] || []).push(i));

  view.innerHTML = `<div class="wrap">
    <div class="pagehead"><div>
      <span class="eyebrow">Search across every club and every note</span>
      <h2>${hits.length} match${hits.length===1?"":"es"} for &ldquo;${esc(state.q)}&rdquo;</h2>
    </div></div>
    ${Object.keys(byClub).length ? Object.keys(byClub).map(cid => `<div class="section" style="margin-top:20px">
      <div class="sectionhead"><h3>${esc(club(cid).short)}</h3><span class="note">${byClub[cid].length} item${byClub[cid].length===1?"":"s"}</span></div>
      <div class="panel">${byClub[cid].map(i => {
        const noteHit = i.updates.find(u => u.text.toLowerCase().includes(q));
        return `<button class="sresult" data-item="${i.id}">
          <div class="t">${hl(i.title)}</div>
          <div class="c">${esc(i.bucket)} &middot; ${esc(i.owner)} &middot; ${STATUSES[i.status]}</div>
          ${noteHit ? `<div class="lastnote" style="margin-top:6px"><b>${fmt(noteHit.date)} &middot; ${esc(noteHit.who)}</b><br>${hl(noteHit.text)}</div>` : ""}
        </button>`;
      }).join("")}</div>
    </div>`).join("") : `<div class="panel"><div class="empty">Nothing matched. Try an owner's name, a club, or a phrase from a note.</div></div>`}
  </div>`;
}

/* ---------- drawer ---------- */
function renderDrawer(){
  const d = document.getElementById("drawer");
  const sc = document.getElementById("scrim");
  if (!state.drawer){ d.classList.remove("open"); d.setAttribute("aria-hidden","true"); sc.classList.remove("open"); return; }
  const it = item(state.drawer); if (!it) return;
  const c = club(it.club);
  const events = [
    {date:it.created, who:"", text:"Added to the game plan", sys:true},
    ...it.updates.map(u => ({...u, sys:false})),
    ...(it.completed ? [{date:it.completed, who:"", text:"Marked " + STATUSES[it.status].toLowerCase(), sys:true}] : [])
  ].sort((a,b) => a.date.localeCompare(b.date));
  const co = carryOver(it);

  d.innerHTML = `
    <div class="drawerhead">
      <div class="top">
        <div>
          <span class="eyebrow">${esc(c.short)} &middot; ${esc(it.bucket)}</span>
          <h3 style="margin-top:6px">${esc(it.title)}</h3>
        </div>
        <button class="btn ghost sm" id="closedrawer" aria-label="Close">Close</button>
      </div>
      <div class="rowmeta">
        <span class="pill ${it.status}">${STATUSES[it.status]}</span>
        ${isStalled(it) ? `<span class="chip stall">silent ${ageDays(it)}d</span>` : `<span class="chip notes">touched ${ageDays(it)}d ago</span>`}
        ${OPEN(it.status) && co ? `<span class="chip notes">carried through ${co} meeting${co>1?"s":""}</span>` : ""}
      </div>
    </div>
    <div class="drawerbody">
      <div class="fields">
        <div class="field"><label for="f-status">Status</label>
          <select id="f-status">${Object.keys(STATUSES).map(s => `<option value="${s}" ${s===it.status?"selected":""}>${STATUSES[s]}</option>`).join("")}</select></div>
        <div class="field"><label for="f-type">Kind</label>
          <select id="f-type">${["task","decision","question"].map(t => `<option value="${t}" ${t===it.type?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></div>
        <div class="field"><label for="f-owner">Owner</label>
          <select id="f-owner">${c.team.map(p => `<option ${p===it.owner?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
        <div class="field"><label for="f-due">Due</label>
          <input id="f-due" type="date" value="${it.due||""}"></div>
      </div>

      <div class="composer">
        <span class="eyebrow">Log an update</span>
        <textarea id="newnote" rows="3" placeholder="What changed? Write it as of today — the title never changes."></textarea>
        <div class="actions">
          <button class="btn primary sm" id="addnote">Add to history</button>
          <label class="chip notes" for="noteWho">heard from</label>
          <select id="noteWho" class="whosel">${c.team.map(p =>
            `<option ${p === "You (Regional)" ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
        </div>
        <span class="chip notes">Dated today${state.meeting && state.meeting.club === it.club ? ", inside this meeting" : ""}. You are the only person who writes here — this records who said it.</span>
      </div>

      <span class="eyebrow" style="display:block; margin-bottom:12px">History</span>
      <div class="timeline">${events.map(e => `<div class="tl ${e.sys?"":"mark"}">
        <div class="when">${fmt(e.date)} &middot; ${daysSince(e.date)}d ago${e.who?` &middot; <span class="who">${esc(e.who)}</span>`:""}</div>
        <div class="what ${e.sys?"sys":""}">${esc(e.text)}</div>
      </div>`).join("")}</div>
    </div>`;
  d.classList.add("open"); d.setAttribute("aria-hidden","false"); sc.classList.add("open");
}

/* ============================================================
   Actions
   ============================================================ */
function record(id, patch, note, who){
  const it = item(id); if (!it) return;
  const from = it.status;
  Object.assign(it, patch);
  if (patch.status === "done" && !it.completed) it.completed = iso(TODAY);
  if (patch.status && patch.status !== "done") it.completed = null;
  if (note) it.updates.push({date:iso(TODAY), who:who || "You (Regional)", text:note});
  if (state.meeting && state.meeting.club === it.club && (note || (patch.status && patch.status !== from))){
    state.meeting.changes.push({item:id, from, to:patch.status || from, note:note || ""});
  }
  save();
}

function render(){
  renderRail();
  if (state.q.trim().length > 1) renderSearch();
  else if (state.view === "meeting") renderMeeting();
  else if (state.view === "recap") renderRecap();
  else if (state.view === "club") renderClub();
  else renderPortfolio();
  renderDrawer();
  document.getElementById("topbar").style.display = state.view === "meeting" ? "none" : "";
}

function openClub(id){ state.club = id; state.view = "club"; state.q = ""; document.getElementById("q").value = ""; render(); window.scrollTo(0,0); }

function addItemPrompt(clubId, inMeeting){
  const title = prompt("What is the item?");
  if (!title || !title.trim()) return;
  const c = club(clubId);
  const bucket = prompt("Which bucket?\n\n" + BUCKETS.map((b,i)=>(i+1)+". "+b).join("\n"), "1");
  const b = BUCKETS[(parseInt(bucket,10)||1)-1] || BUCKETS[0];
  const owner = prompt("Who owns it?\n\n" + c.team.map((p,i)=>(i+1)+". "+p).join("\n"), "1");
  const o = c.team[(parseInt(owner,10)||1)-1] || c.team[0];
  const it = {
    id:"n"+Date.now().toString(36), club:clubId, bucket:b, parent:null, title:title.trim(),
    type:"task", owner:o, status:"not_started", created:iso(TODAY), due:null, completed:null,
    updates:[{date:iso(TODAY), who:"You (Regional)", text:"Added during the " + (inMeeting?"meeting":"plan review") + "."}]
  };
  db.items.push(it);
  if (inMeeting && state.meeting){ state.meeting.created = state.meeting.created || []; state.meeting.created.push(it.id); }
  save(); render(); toast("Added to " + b);
}

document.addEventListener("click", e => {
  const t = e.target;
  const hit = sel => t.closest(sel);

  if (hit('[data-nav="portfolio"]')){ state.view="portfolio"; state.club=null; state.q=""; document.getElementById("q").value=""; render(); return; }
  const cbtn = hit("[data-club]"); if (cbtn){ openClub(cbtn.dataset.club); return; }
  const card = hit("[data-open]"); if (card){ openClub(card.dataset.open); return; }

  const f = hit("[data-filter]"); if (f){ state.filter = f.dataset.filter; render(); return; }
  const bk = hit("[data-bucket]"); if (bk){
    state.collapsed = state.collapsed || {};
    const k = state.club + bk.dataset.bucket;
    state.collapsed[k] = !state.collapsed[k]; render(); return;
  }

  if (hit("#closedrawer") || hit("#scrim")){ state.drawer = null; renderDrawer(); return; }
  const oi = hit("[data-open-item]"); if (oi){ state.drawer = oi.dataset.openItem; renderDrawer(); return; }
  const row = hit("[data-item]"); if (row && !hit(".statusgroup") && !hit(".notefield")){ state.drawer = row.dataset.item; renderDrawer(); return; }

  if (hit("#addnote")){
    const v = document.getElementById("newnote").value.trim();
    if (!v) return;
    const who = (document.getElementById("noteWho") || {}).value;
    record(state.drawer, {}, v, who); render(); toast("Logged to history"); return;
  }
  if (hit("#addbtn")){ addItemPrompt(state.club, false); return; }
  if (hit("#meetadd")){ addItemPrompt(state.meeting.club, true); return; }

  if (hit("#startmeet")){
    state.meeting = {club:state.club, date:iso(TODAY), changes:[], created:[], closed:false};
    state.view = "meeting"; state.drawer = null; render(); window.scrollTo(0,0); return;
  }
  const set = hit("[data-set]"); if (set){
    const [id, s] = set.dataset.set.split("|");
    record(id, {status:s}); render(); return;
  }
  const sn = hit("[data-savenote]"); if (sn){
    const input = document.querySelector(`[data-note="${sn.dataset.savenote}"]`);
    const v = input.value.trim(); if (!v) return;
    const who = (document.querySelector(`[data-who="${sn.dataset.savenote}"]`) || {}).value;
    record(sn.dataset.savenote, {}, v, who); render(); toast("Logged"); return;
  }
  if (hit("#meetend")){
    const m = state.meeting;
    m.closed = true; m.kind = "Club visit";
    db.meetings.push({id:"m"+Date.now(), club:m.club, date:m.date, kind:m.kind, changes:m.changes, closed:true});
    save(); state.view = "recap"; render(); window.scrollTo(0,0); return;
  }
  if (hit("#backtoclub")){ const cid = state.meeting.club; state.meeting = null; openClub(cid); return; }
  if (hit("#copyrecap")){
    const txt = recapText();
    navigator.clipboard.writeText(txt).then(() => toast("Recap copied — paste it straight into the follow-up email"),
      () => toast("Copy blocked by the browser"));
    return;
  }
  if (hit("#tmpl")){
    alert("Standard plan template\n\n" + BUCKETS.map(b => "· " + b).join("\n") +
      "\n\nEvery club starts from these seven buckets, which is what makes the portfolio view comparable across clubs. In a live version this is where you would edit the template and push it to a new club.");
    return;
  }
  if (hit("#resetbtn")){
    if (confirm("Reset the demo back to its seeded fictional data?")){
      db = buildSeed(); save(); state.meeting = null; state.drawer = null; state.view = "portfolio"; state.club = null; render();
      toast("Demo data reset");
    }
    return;
  }
  if (hit("#themebtn")){
    const root = document.documentElement;
    const cur = root.getAttribute("data-theme");
    const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("gpb.theme", next); } catch(err){}
    return;
  }
});

document.addEventListener("change", e => {
  if (!state.drawer) return;
  const id = state.drawer;
  if (e.target.id === "f-status"){ record(id, {status:e.target.value}); render(); }
  if (e.target.id === "f-type"){ record(id, {type:e.target.value}); render(); }
  if (e.target.id === "f-owner"){ record(id, {owner:e.target.value}); render(); }
  if (e.target.id === "f-due"){ record(id, {due:e.target.value || null}); render(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.drawer){ state.drawer = null; renderDrawer(); }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.note){
    const v = e.target.value.trim(); if (!v) return;
    const who = (document.querySelector(`[data-who="${e.target.dataset.note}"]`) || {}).value;
    record(e.target.dataset.note, {}, v, who); render(); toast("Logged");
  }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("row")){
    state.drawer = e.target.dataset.item; renderDrawer();
  }
});

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });

try { const th = localStorage.getItem("gpb.theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

render();
</script>
